services:
  backend:
    build: ./backend
    container_name: ai-drama-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/platform.db
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: ai-drama-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

