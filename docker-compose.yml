services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-drama-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/platform.db
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: ai-drama-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
